name: acadexa
description: "AI-powered study planner."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Routing
  go_router: ^16.0.0

  # Networking
  dio: ^5.8.0+1

  # Local Storage
  shared_preferences: ^2.5.3

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # Authentication Buttons
  sign_in_button: ^3.2.0

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  fl_chart: ^1.0.0
  uuid: ^4.5.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Google Authentication
  google_sign_in: ^7.2.0

  # Apple Authentication
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/home/